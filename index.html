<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แมวอิ่ม MEOWFULL | ร้านอาหารแมว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF8F0;
    --ink:#22312B;
    --ink-soft:#5B6B62;
    --primary:#1B4B43;      /* deep teal - main brand */
    --primary-dark:#123832;
    --accent:#E76F51;       /* coral - CTA / price */
    --warm:#F4A261;         /* peach - highlight */
    --sage:#B7D8C1;         /* soft sage - chips bg */
    --sage-deep:#7FAE8E;
    --card:#FFFFFF;
    --line:#E7DFCF;
    --shadow: 0 10px 30px -12px rgba(27,75,67,.25);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Sarabun',sans-serif; font-size:16px; line-height:1.6;
  }
  h1,h2,h3,h4,.display{ font-family:'Kanit',sans-serif; margin:0; }
  a{color:inherit;}
  img{max-width:100%; display:block;}
  button{font-family:inherit; cursor:pointer;}

  /* ---------- NAV ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:var(--primary); color:#fff;
    border-bottom:4px solid var(--warm);
  }
  .nav-wrap{
    max-width:1120px; margin:0 auto; padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .paw{ width:34px; height:34px; }
  .brand-text{ font-family:'Kanit',sans-serif; font-weight:700; font-size:20px; line-height:1.1; }
  .brand-text small{ display:block; font-family:'Sarabun',sans-serif; font-weight:400; font-size:11px; letter-spacing:.12em; opacity:.75; }
  nav{ display:flex; gap:6px; }
  .nav-btn{
    border:none; background:transparent; color:#fff; opacity:.75;
    font-weight:600; font-size:15px; padding:9px 14px; border-radius:999px;
    transition:.18s;
  }
  .nav-btn:hover{ opacity:1; background:rgba(255,255,255,.08); }
  .nav-btn.is-active{ opacity:1; background:var(--warm); color:var(--primary-dark); }
  .cart-pill{
    display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.12);
    padding:8px 14px; border-radius:999px; font-weight:600; font-size:14px; border:none; color:#fff;
  }
  .cart-pill b{ background:var(--accent); color:#fff; border-radius:999px; padding:1px 8px; font-size:12px; }

  main{ max-width:1120px; margin:0 auto; padding:0 20px 80px; }
  .page{ display:none; animation:fade .35s ease; }
  .page.is-active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- LANDING / ENTRANCE PAGE ---------- */
  .landing-hero{
    position:relative; width:100%; height:calc(100vh - 66px); min-height:560px; max-height:820px;
    overflow:hidden;
  }
  .landing-img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .landing-overlay{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(18,54,47,.05) 0%, rgba(18,54,47,.35) 55%, rgba(18,54,47,.88) 100%);
    display:flex; align-items:flex-end; justify-content:center;
    padding:70px 20px 64px;
  }
  .landing-content{ text-align:center; color:#fff; max-width:600px; }
  .landing-eyebrow{
    font-size:12.5px; font-weight:700; letter-spacing:.18em; color:var(--warm); text-transform:uppercase;
  }
  .landing-title{
    margin-top:10px; font-size:46px; font-weight:800; line-height:1.15; text-shadow:0 4px 18px rgba(0,0,0,.35);
  }
  .landing-title span{ color:var(--warm); }
  .landing-sub{
    margin-top:12px; color:#EAF3EE; font-size:15.5px; letter-spacing:.02em;
  }
  .landing-btn{
    margin-top:30px; background:var(--warm); color:var(--primary-dark); border:none; border-radius:999px;
    padding:15px 38px; font-weight:700; font-size:16px; font-family:'Kanit'; letter-spacing:.02em;
    box-shadow:0 12px 26px -10px rgba(0,0,0,.5); transition:.18s;
  }
  .landing-btn:hover{ transform:translateY(-2px); box-shadow:0 16px 30px -10px rgba(0,0,0,.55); }
  .landing-badges{ display:flex; gap:10px; justify-content:center; margin-top:22px; flex-wrap:wrap; }
  .landing-badges span{
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.35); backdrop-filter:blur(2px);
    border-radius:999px; padding:6px 14px; font-size:12.5px; font-weight:600;
  }
  @media (max-width:880px){
    .landing-hero{ height:100vh; min-height:520px; }
    .landing-title{ font-size:32px; }
  }

  /* ---------- ART (illustrated product art, no external images needed) ---------- */
  .art-wrap{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .art-wrap::before{
    content:''; position:absolute; inset:0;
    background-image: radial-gradient(rgba(255,255,255,.35) 1.5px, transparent 1.5px);
    background-size: 16px 16px;
  }
  .art-wrap.has-photo::before{ display:none; }
  .art-wrap.has-photo{ background:none !important; }
  .art-icon{ width:44%; height:auto; position:relative; z-index:1; filter:drop-shadow(0 6px 10px rgba(0,0,0,.12)); }
  .art-photo{ width:100%; height:100%; object-fit:cover; display:block; }
  .art-wrap.hero-art{ }

  /* ---------- HOME ---------- */
  .hero{
    margin-top:28px; border-radius:28px; overflow:hidden; position:relative;
    background:linear-gradient(120deg,var(--primary) 0%, var(--primary-dark) 100%);
    color:#fff; padding:48px 40px; display:grid; grid-template-columns:1.1fr .9fr; gap:24px; align-items:center;
  }
  .hero h1{ font-size:38px; font-weight:800; line-height:1.25; }
  .hero h1 span{ color:var(--warm); }
  .hero p{ margin-top:14px; color:#DCEAE4; max-width:46ch; }
  .hero-stats{ display:flex; gap:22px; margin-top:22px; flex-wrap:wrap; }
  .hero-stats div{ background:rgba(255,255,255,.09); border-radius:14px; padding:10px 16px; }
  .hero-stats b{ display:block; font-family:'Kanit'; font-size:22px; color:var(--warm); }
  .hero-stats span{ font-size:12px; opacity:.85; }
  .hero-img{ border-radius:20px; overflow:hidden; aspect-ratio:4/3; box-shadow:var(--shadow); background:linear-gradient(150deg,var(--warm),var(--accent)); }
  .hero-img svg{ width:100%; height:100%; }

  section.block{ margin-top:52px; }
  .block-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:18px; gap:12px; flex-wrap:wrap;}
  .block-head h2{ font-size:24px; color:var(--primary-dark); }
  .block-head p{ color:var(--ink-soft); margin-top:4px; font-size:14px; }
  .eyebrow{ font-size:12px; font-weight:700; letter-spacing:.14em; color:var(--accent); text-transform:uppercase; }

  .cat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .cat-card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px;
    text-align:left; transition:.18s; display:flex; flex-direction:column; gap:6px;
  }
  .cat-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--sage-deep); }
  .cat-card .n{ font-family:'Kanit'; font-weight:700; font-size:17px; color:var(--primary-dark); }
  .cat-card .c{ font-size:12px; color:var(--ink-soft); }
  .cat-card .badge{ align-self:flex-start; background:var(--sage); color:var(--primary-dark); font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; }

  .prod-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
  .prod-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
    display:flex; flex-direction:column; transition:.2s;
  }
  .prod-card:hover{ box-shadow:var(--shadow); transform:translateY(-4px); }
  .prod-img{ aspect-ratio:4/3; overflow:hidden; }
  .prod-body{ padding:16px 16px 18px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .prod-tags{ display:flex; gap:6px; flex-wrap:wrap; }
  .tag{ font-size:10.5px; font-weight:700; background:var(--sage); color:var(--primary-dark); padding:2px 9px; border-radius:999px; letter-spacing:.02em;}
  .tag.alt{ background:#FBE3D6; color:#9C4A2E; }
  .prod-name{ font-family:'Kanit'; font-weight:600; font-size:16px; color:var(--ink); }
  .prod-desc{ font-size:12.5px; color:var(--ink-soft); flex:1; }
  .prod-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:4px; }
  .price{ font-family:'Kanit'; font-weight:700; color:var(--accent); font-size:17px; }
  .add-btn{
    background:var(--primary); color:#fff; border:none; border-radius:999px; padding:8px 15px;
    font-weight:600; font-size:13px; transition:.15s;
  }
  .add-btn:hover{ background:var(--primary-dark); }
  .add-btn:disabled{ background:var(--sage-deep); cursor:default; }

  /* ---------- PRODUCTS PAGE ---------- */
  .products-head{ margin-top:30px; }
  .search-row{ display:flex; gap:10px; margin-bottom:18px; }
  .search-row input{
    flex:1; padding:13px 16px; border-radius:12px; border:1px solid var(--line); font-family:inherit; font-size:15px; background:#fff;
  }
  .filter-panel{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin-bottom:24px;
  }
  .filter-panel h3{ font-size:15px; color:var(--primary-dark); margin-bottom:4px; }
  .filter-panel .hint{ font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; }
  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .chip{
    border:1.5px solid var(--line); background:#fff; color:var(--ink); border-radius:999px;
    padding:7px 15px; font-size:13.5px; font-weight:600; transition:.15s;
  }
  .chip.is-on{ background:var(--primary); border-color:var(--primary); color:#fff; }
  .op-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; border-top:1px dashed var(--line); padding-top:16px; }
  .op-row .lbl{ font-size:13px; font-weight:700; color:var(--primary-dark); }
  .op-btn{
    display:flex; align-items:center; gap:8px; border:1.5px solid var(--line); background:#fff;
    padding:7px 14px 7px 10px; border-radius:12px; font-size:13.5px; font-weight:600;
  }
  .op-btn.is-on{ border-color:var(--accent); background:#FFF1EC; color:#9C4A2E; }
  .op-btn svg{ width:26px; height:20px; }
  .result-line{ font-size:13px; color:var(--ink-soft); margin:6px 0 16px; }
  .result-line b{ color:var(--primary-dark); }

  /* ---------- CHECKOUT ---------- */
  .checkout-grid{ display:grid; grid-template-columns:1.4fr 1fr; gap:26px; margin-top:28px; align-items:start; }
  .cart-item{
    display:flex; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px;
  }
  .cart-item .art-wrap{ width:78px; height:78px; border-radius:12px; flex-shrink:0; }
  .cart-item .art-icon{ width:52%; }
  .ci-body{ flex:1; display:flex; flex-direction:column; gap:4px; }
  .ci-top{ display:flex; justify-content:space-between; gap:8px; }
  .ci-name{ font-weight:600; font-size:14.5px; }
  .ci-remove{ background:none; border:none; color:var(--ink-soft); font-size:12px; text-decoration:underline; padding:0; }
  .qty-row{ display:flex; align-items:center; gap:10px; margin-top:4px; }
  .qty-btn{ width:26px; height:26px; border-radius:8px; border:1px solid var(--line); background:#fff; font-weight:700; }
  .qty-num{ font-weight:600; min-width:16px; text-align:center; }
  .ci-price{ font-family:'Kanit'; color:var(--accent); font-weight:700; }
  .empty-note{ background:var(--card); border:1px dashed var(--line); border-radius:16px; padding:34px; text-align:center; color:var(--ink-soft); }

  .summary{ background:var(--primary); color:#fff; border-radius:20px; padding:24px; position:sticky; top:92px; }
  .summary h3{ font-family:'Kanit'; font-size:18px; margin-bottom:14px; }
  .sum-row{ display:flex; justify-content:space-between; font-size:14px; padding:7px 0; color:#DCEAE4; }
  .sum-row.total{ border-top:1px solid rgba(255,255,255,.25); margin-top:8px; padding-top:14px; font-size:18px; font-weight:700; color:#fff; font-family:'Kanit'; }
  .promo{
    display:flex; gap:8px; align-items:flex-start; background:rgba(255,255,255,.1); border-radius:12px; padding:10px 12px; margin-top:10px; font-size:12.5px; line-height:1.5;
  }
  .promo.on{ background:rgba(244,162,97,.22); border:1px solid var(--warm); }
  .promo .dot{ width:7px; height:7px; border-radius:50%; margin-top:5px; flex-shrink:0; background:rgba(255,255,255,.4); }
  .promo.on .dot{ background:var(--warm); }
  .checkout-btn{
    width:100%; margin-top:16px; background:var(--warm); color:var(--primary-dark); border:none; border-radius:12px;
    padding:14px; font-weight:700; font-size:15px; font-family:'Kanit';
  }
  .nudge{ font-size:12px; margin-top:10px; color:#F6D9BF; }

  .reco-title{ font-size:15px; font-weight:700; color:var(--primary-dark); margin:36px 0 12px; }
  .reco-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .reco-card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px; text-align:center; }
  .reco-card .art-wrap{ width:100%; aspect-ratio:1; border-radius:10px; margin-bottom:8px; }
  .reco-card .n{ font-size:12.5px; font-weight:600; margin-bottom:2px; }
  .reco-card .p{ font-size:12.5px; color:var(--accent); font-weight:700; font-family:'Kanit'; margin-bottom:8px; }
  .reco-card button{ width:100%; background:var(--sage); border:none; border-radius:8px; padding:6px; font-size:12px; font-weight:700; color:var(--primary-dark); }

  footer{ text-align:center; padding:30px 20px; color:var(--ink-soft); font-size:12.5px; }

  /* ---------- ORDER CONFIRMATION MODAL ---------- */
  .modal-backdrop{
    display:none; position:fixed; inset:0; z-index:100; background:rgba(18,54,47,.55);
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-backdrop.is-open{ display:flex; }
  .modal-card{
    background:#fff; border-radius:22px; padding:34px 30px; max-width:420px; width:100%;
    text-align:center; box-shadow:0 24px 60px -16px rgba(0,0,0,.4); animation:fade .25s ease;
  }
  .modal-check{
    width:64px; height:64px; border-radius:50%; background:var(--sage); color:var(--primary-dark);
    font-size:32px; font-weight:800; display:flex; align-items:center; justify-content:center; margin:0 auto 14px;
  }
  .modal-card h3{ font-size:22px; color:var(--primary-dark); }
  .modal-order-no{ font-size:13px; color:var(--ink-soft); margin-top:6px; }
  .modal-order-no b{ color:var(--accent); font-family:'Kanit'; }
  .modal-summary{
    text-align:left; background:var(--bg); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin:18px 0; font-size:13.5px;
  }
  .modal-summary .m-row{ display:flex; justify-content:space-between; padding:4px 0; color:var(--ink-soft); }
  .modal-summary .m-row.total{ border-top:1px dashed var(--line); margin-top:6px; padding-top:10px; font-weight:700; color:var(--primary-dark); font-family:'Kanit'; font-size:15.5px; }
  .modal-thanks{ font-size:13px; color:var(--ink-soft); }
  .modal-close-btn{
    width:100%; margin-top:18px; background:var(--primary); color:#fff; border:none; border-radius:12px;
    padding:13px; font-weight:700; font-size:14.5px; font-family:'Kanit';
  }
  .modal-close-btn:hover{ background:var(--primary-dark); }

  @media (max-width:880px){
    .hero{ grid-template-columns:1fr; padding:32px 22px; }
    .cat-grid{ grid-template-columns:repeat(2,1fr); }
    .prod-grid{ grid-template-columns:repeat(2,1fr); }
    .checkout-grid{ grid-template-columns:1fr; }
    .reco-grid{ grid-template-columns:repeat(2,1fr); }
    nav{ display:none; }
  }
</style>
</head>
<body>

<header>
  <div class="nav-wrap">
    <div class="brand">
      <svg class="paw" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="40" r="15" fill="#F4A261"/><circle cx="14" cy="24" r="8" fill="#F4A261"/><circle cx="50" cy="24" r="8" fill="#F4A261"/><circle cx="24" cy="12" r="7" fill="#F4A261"/><circle cx="40" cy="12" r="7" fill="#F4A261"/></svg>
      <div class="brand-text">แมวอิ่ม MEOWFULL<small>CAT FOOD & SUPPLY</small></div>
    </div>
    <nav id="nav">
      <button class="nav-btn" data-page="home">หน้าแรก</button>
      <button class="nav-btn" data-page="products">สินค้าทั้งหมด</button>
      <button class="nav-btn" data-page="checkout">ตะกร้า</button>
    </nav>
    <button class="cart-pill" data-page="checkout" id="cartPill">
      🛒 ตะกร้าของฉัน <b id="cartCount">0</b>
    </button>
  </div>
</header>

<!-- ============ PAGE 0: LANDING / ENTRANCE (shopfront photo) ============ -->
